[package]
name = "captionrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["bakgio"]
license = "MIT OR Apache-2.0"
description = "Advanced subtitle converter and processor"
repository = "https://github.com/bakgio/captionrs"
readme = "README.md"
keywords = ["subtitles", "captions", "srt", "webvtt", "ttml"]
categories = ["command-line-utilities", "parser-implementations", "text-processing", "multimedia"]
exclude = [".github/**", "tests/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
encoding_rs = "0.8.35"
env_logger = "0.11.10"
html-escape = "0.2.13"
mp4forge = "0.4.0"
regex = "1.12.3"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["fs", "io-util", "rt", "rt-multi-thread", "macros"], optional = true }
unicode-normalization = "0.1.25"

[features]
default = []
async = ["dep:async-trait", "dep:tokio"]

[dev-dependencies]
futures = "0.3.32"
tempfile = "3.27.0"
